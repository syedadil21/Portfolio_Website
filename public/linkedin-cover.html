<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1584px;
    height: 396px;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, #050810 0%, #0a1628 30%, #0d1f3c 60%, #091525 100%);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 80px;
    position: relative;
    overflow: hidden;
  }

  /* Subtle geometric shapes */
  .shape {
    position: absolute;
    border-radius: 50%;
    opacity: 0.06;
  }
  .shape-1 {
    width: 500px; height: 500px;
    top: -200px; right: -100px;
    background: radial-gradient(circle, #3b82f6, transparent 70%);
  }
  .shape-2 {
    width: 400px; height: 400px;
    bottom: -200px; left: 100px;
    background: radial-gradient(circle, #8b5cf6, transparent 70%);
  }
  .shape-3 {
    width: 300px; height: 300px;
    top: 50px; left: 40%;
    background: radial-gradient(circle, #06b6d4, transparent 70%);
    opacity: 0.04;
  }

  /* Grid pattern overlay */
  .grid-overlay {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  /* Content */
  .left {
    position: relative;
    z-index: 2;
  }
  .name {
    font-size: 56px;
    font-weight: 800;
    color: #ffffff;
    letter-spacing: -0.02em;
    margin-bottom: 8px;
  }
  .title {
    font-size: 24px;
    color: #94a3b8;
    font-weight: 400;
    margin-bottom: 24px;
  }
  .tags {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .tag {
    padding: 6px 16px;
    border-radius: 999px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    color: #cbd5e1;
    font-size: 14px;
    font-weight: 500;
  }

  .right {
    position: relative;
    z-index: 2;
    text-align: right;
  }
  .url {
    font-size: 18px;
    color: #64748b;
    font-weight: 500;
    margin-bottom: 12px;
  }

  /* Accent line */
  .accent-line {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, #3b82f6, #8b5cf6, transparent);
  }
</style>
</head>
<body>
  <div class="shape shape-1"></div>
  <div class="shape shape-2"></div>
  <div class="shape shape-3"></div>
  <div class="grid-overlay"></div>

  <div class="left">
    <div class="name">Syed Adil</div>
    <div class="title">Full Stack Software Engineer</div>
    <div class="tags">
      <span class="tag">Next.js</span>
      <span class="tag">React Native</span>
      <span class="tag">ASP.NET</span>
      <span class="tag">AI / LLM</span>
      <span class="tag">PostgreSQL</span>
      <span class="tag">TypeScript</span>
    </div>
  </div>

  <div class="right">
    <div class="url">syedadil21.vercel.app</div>
  </div>

  <div class="accent-line"></div>
</body>
</html>
